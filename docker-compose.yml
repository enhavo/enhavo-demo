services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@database:3306/app?serverVersion=mariadb-10.11.18&charset=utf8mb4"

volumes:
  database_data:
