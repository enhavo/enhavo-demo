# Demo pages loaded by App\DataFixtures\ORM\PageFixture.
# Each entry becomes a public Page with a route.
#
# `blocks:` seeds block content into the page's content area (stored in the DB).
# Each block `type` must match a key in config/packages/enhavo_block.yaml AND be
# handled in PageFixture::createBlock(). This is how you reuse a registered block
# as fixture data — add the type here, add a builder in PageFixture if it's new.
#
# Available block types: advanced_text, card, content_flex, team, quote, hero,
# swipe_teaser, gallery_block, spacer, jobs_offer, logo_wall, nag_screen, contact.
# (Only `hero` has a builder so far — add more in PageFixture as needed.)
- title: 'Home'
  slug: home
  url: /
  blocks:
    - type: card
      gradient: 'yes'
      layouts: 'media-text'
      media: 'card/enhavo-demo-header.jpg'
      overline: 'Willkommen bei John Müller'
      headline: 'Ihrem zuverlässigen Partner für glückliche Hunde!'
      copy: 'Hallo, ich bin John, Ihr passionierter Hundebegeisterter und leidenschaftlicher Gassigeher. Obwohl ich selbst keine geeignete Wohnsituation für einen eigenen Hund habe, möchte ich meine Liebe und Sorgfalt gerne mit Ihren vierbeinigen Freunden teilen. Wenn Sie auf der Suche nach jemandem sind, der sich liebevoll um Ihren pelzigen Begleiter kümmert, sind Sie hier genau richtig!t'
      ctaTitle: KONTAKT AUFNEHMEN

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: content_flex
      layout: 'card'
      alignment: 'center'
      headline: 'Warum ein Gassigeher?'
      items:
        - media: 'content-flex/kartondog1.png'
          headline: 'Zeitersparnis und Glück für Ihren Hund:'
          copy: 'Das moderne Leben kann hektisch sein, und manchmal bleibt nicht genug Zeit, um Ihrem Hund die Aufmerksamkeit und Bewegung zu bieten, die er verdient. Durch meine Dienstleistungen als erfahrener Gassigeher können Sie sicher sein, dass Ihr Hund regelmäßige Spaziergänge und eine Extraportion Zuneigung erhält. Ein glücklicher Hund bedeutet auch ein glücklicher Besitzer!'
        - media: 'content-flex/kartondog2.png'
          headline: 'Flexible Betreuung nach Ihren Bedürfnissen:'
          copy: 'Ob Sie lange Arbeitstage haben oder einfach mal eine Auszeit benötigen - ich biete flexible Betreuungszeiten an. Von kurzen Gassirunden bis hin zu halbtägiger Betreuung ist alles möglich. Sie entscheiden, was am besten zu Ihrem Zeitplan und den Bedürfnissen Ihres Hundes passt.'
        - media: 'content-flex/kartondog3.png'
          headline: 'Vertrauenswürdige Sorge durch erfahrene Hände:'
          copy: 'Ihre Hunde sind Familienmitglieder, und ich behandele sie auch so. Mit meiner Erfahrung im Umgang mit verschiedenen Hunderassen und -temperamenten können Sie sich darauf verlassen, dass Ihr Liebling in sicheren Händen ist. Ich sorge nicht nur für Bewegung, sondern auch für liebevolle Aufmerksamkeit und sorgfältige Pflege.'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: quote
      alignment: 'center'
      text: 'Seitdem John sich um unseren Labrador kümmert, hat sich das Energieniveau und die Lebensfreude unseres Hundes deutlich verbessert. Wir schätzen die Flexibilität und vor allem die Liebe, die er unserem pelzigen Familienmitglied entgegenbringt.'
      author: 'Familie Müller'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: form
      text: 'Sie möchten, dass Ihr Hund von einer erfahrenen Hand und einem liebevollen Herzen betreut wird? Kontaktieren Sie mich einfach über das unten stehende Formular, und lassen Sie uns gemeinsam dafür sorgen, dass Ihr Hund die besten Spaziergänge seines Lebens hat!'
      firstName: ''
      disclaimerMessage: 'Hiermit erkläre ich, dass ich die AGB aufmerksam gelesen habe und dass ich. Meine Einwilligung zur Verarbeitung meiner persönlichen Daten gemäß geltender Datenschutzverordnung gebe.'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: gallery_block
      layout: 'rows'
      amountOfColumns: '3'
      lightBox: '1'
      items:
        - picture: 'gallery/dog-01.jpg'
        - picture: 'gallery/dog-02.jpg'
        - picture: 'gallery/dog-03.jpg'
        - picture: 'gallery/dog-04.jpg'
        - picture: 'gallery/dog-05.jpg'
        - picture: 'gallery/dog-06.jpg'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: quote
      alignment: 'center'
      text: 'In stressigen Zeiten war John eine echte Lebensretterin für uns und unseren Vierbeiner. Seine Zuverlässigkeit und die spürbare Hingabe zu den Tieren machen ihn zu unserem ersten Ansprechpartner für Hundebetreuung.'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: content_flex
      layout: 'card'
      alignment: 'left'
      items:
        - media: 'content-flex/dog1.jpg'
          headline: 'Die Sprache der Rutenwedler: Was uns der Schwanz unseres Hundes verrät'
          copy: 'Ein Blick auf die feine Kunst der Kommunikation zwischen Hunden und Menschen - insbesondere durch die subtile Sprache der Schwänze. In meinem neuesten Blogartikel erkunden wir, was die verschiedenen Schwanzbewegungen bedeuten können und wie wir dadurch das emotionale Wohlbefinden unserer pelzigen Begleiter besser verstehen können. Von fröhlichem Wedeln bis zur aufrechten Haltung - lassen Sie uns gemeinsam die faszinierende Welt der hündischen Ausdrucksweise erkunden!'
          ctaTitle: 'Mehr lesen'
          ctaLink: '/blog'
          ctaTarget: '_self'
        - media: 'content-flex/dog 2.png'
          headline: 'Spiegelneuronen im Spiel: Warum wir uns in unseren Hunden wiedererkennen'
          copy: 'In diesem Artikel werfen wir einen Blick auf die erstaunliche Verbindung zwischen Mensch und Hund, die durch Spiegelneuronen geprägt ist. Entdecken Sie, wie die Emotionen und Verhaltensweisen Ihres Hundes oft ein Spiegelbild Ihrer eigenen sein können. Von Freude und Enthusiasmus bis hin zu Empathie - tauchen Sie ein in die wunderbare Welt der spiegelnden Bindung zwischen Ihnen und Ihrem besten Freund auf vier Pfoten.'
          ctaTitle: 'Mehr lesen'
          ctaLink: '/blog'
          ctaTarget: '_self'
        - media: 'content-flex/dog3.png'
          headline: 'Die Kunst der Gelassenheit: Was wir von Hunden über Entschleunigung lernen können'
          copy: 'Unsere hektische Welt könnte eine Seite aus dem Buch der Hunde über Gelassenheit nehmen. In diesem Blogartikel erkunden wir, wie Hunde uns mit ihrer natürlichen Fähigkeit zur Entschleunigung inspirieren können. Von entspannten Spaziergängen bis hin zu ruhigen Augenblicken des Innehaltens - lassen Sie uns gemeinsam die Lehren der Gelassenheit von unseren treuen Gefährten lernen und in unseren eigenen Alltag integrieren.'
          ctaTitle: 'Mehr lesen'
          ctaLink: '/blog'
          ctaTarget: '_self'

    - type: spacer
      desktop: '100'
      tablet: '50'
      mobile: '30'

    - type: team
      overline: 'Im Team für das Wohlbefinden Ihrer Vierbeiner:'
      headline: 'Neben mir stehen Ihnen auch meine ebenso hundebegeisterten Partner zur Verfügung, um sicherzustellen, dass Ihr pelziger Freund die bestmögliche Betreuung und Liebe erhält.'
      items:
        - picture: 'team/person1.png'
