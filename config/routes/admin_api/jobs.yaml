app_jobs_api_index:
    path: /jobs/index
    methods: [GET]
    defaults: { _expose: admin_api, _endpoint: { type: resource_index, grid: app.jobs } }

app_jobs_api_list:
    path: /jobs/list
    methods: [GET, POST]
    defaults: { _expose: admin_api, _endpoint: { type: resource_list, grid: app.jobs } }

app_jobs_api_create:
    path: /jobs/create
    methods: [GET, POST]
    defaults: { _expose: admin_api, _endpoint: { type: resource_create, input: app.jobs } }

app_jobs_api_update:
    path: /jobs/update/{id}
    methods: [GET, POST]
    defaults: { _expose: admin_api, _endpoint: { type: resource_update, input: app.jobs } }

app_jobs_api_delete:
    path: /jobs/delete/{id}
    methods: [DELETE, POST]
    defaults: { _expose: admin_api, _endpoint: { type: resource_delete, input: app.jobs } }

app_jobs_api_batch:
    path: /jobs/batch
    methods: [POST]
    defaults: { _expose: admin_api, _endpoint: { type: resource_batch, grid: app.jobs } }
